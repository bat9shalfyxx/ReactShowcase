name: CI/CD Pipeline
run-name: ${{ github.actor }}'s CI/CD Pipeline is running

on:
  push:
    branches: [master]
  pull_request: 
    branches: [master]

jobs:
  quality:
    name: Code quality check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Update Node.js v[${{ matrix.node-version }}]
        uses: actions/setup-node@v6
        with: 
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (clearly)
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck
      
      - name: ESLint check
        run: npm run lint
      
      - name: Prettier format check
        run: npm run format


  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
  
    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update Node.js v[${{ matrix.node-version }}]
        uses: actions/setup-node@v6
        with: 
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies (clearly)
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with: 
          name: dist
          path: dist/
          retention-days: 7


  deploy:
    name: Deploy ti GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/

      - name: Setup pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v6
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v6
